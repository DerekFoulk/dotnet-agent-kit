# The release job the kit and every app share (ADR-0022, ADR-0096). Call it from a workflow that runs on pushes to
# main, granting the job the four write permissions below:
#   uses: DerekFoulk/dotnet-agent-kit/.github/workflows/release-please.reusable.yml@<commit SHA> # v0.1.0
#
# release-please keeps a release PR open with the next version and its notes; merging it tags vX.Y.Z and publishes a
# GitHub Release. Each release takes the SemVer number its Conventional Commits earn, as release-please-config.json
# sets it (ADR-0096). MinVer builds take their version from that tag (ADR-0019). Proven end to end in
# spikes/release-please/README.md. release-please reads the config, manifest and commits of the calling repo.
# Building and publishing a release belongs in the caller, after this job, once there's something to publish (tags
# made with GITHUB_TOKEN start no other workflows; spike finding 7).
name: release-please

on:
  workflow_call:

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    # One run at a time in each repo: two merges seconds apart start two runs, and both update the release PR's branch,
    # so the later update fails (2026-11-26). A run in progress is never cancelled; GitHub keeps only the newest waiting
    # run, which reads every commit since the last release, so nothing is lost.
    concurrency:
      group: release-please-${{ github.repository }}
      cancel-in-progress: false
    # release-please needs contents, pull-requests and issues (labels); the approval step needs actions. The caller's
    # job must grant each of them.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

      # The release PR is opened or updated with GITHUB_TOKEN, so its pull_request CI runs are created
      # but wait for approval, which keeps the required checks from reporting. Approve those runs, and
      # only those: pull_request runs waiting for approval on the release PR's own head commit. (A fork
      # PR could reuse release-please's branch name, but not this repo's commit.) A repo has several
      # pull_request workflows, which may start a little apart, so it keeps looking for about 90 seconds.
      # release-please reports no PR when the release PR didn't change (for example, a rerun on the
      # same commit), so fall back to the open release PR: opened by GitHub Actions, labelled
      # "autorelease: pending", on release-please's branch. With none open, there's nothing to do.
      - name: Approve CI on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          number="$(echo "$PR" | jq -r '.number // empty' 2>/dev/null || true)"
          if [ -z "$number" ]; then
            number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --author app/github-actions --label "autorelease: pending" --json number,headRefName --jq '[.[] | select(.headRefName == "release-please--branches--main")][0].number // empty')"
          fi
          if [ -z "$number" ]; then
            echo "No open release PR; nothing to approve."
            exit 0
          fi
          sha="$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          echo "Release PR #$number, head commit $sha"
          approved=0
          for attempt in 1 2 3 4 5 6 7 8 9; do
            ids="$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$sha" --event pull_request --status action_required --json databaseId --jq '.[].databaseId')"
            for id in $ids; do
              echo "Approving run $id"
              # A run cancelled since the list (CI cancels superseded runs) can't be approved; go on.
              if gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve"; then
                approved=$((approved + 1))
              else
                echo "::warning::Could not approve run $id"
              fi
            done
            sleep 10
          done
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$sha" --event pull_request --json databaseId --jq 'length')"
          echo "Approved $approved run(s); $runs pull_request run(s) on $sha"
          # No run at all means the release PR can't pass its required checks; say so loudly.
          if [ "$runs" -eq 0 ]; then
            echo "::error::Release PR #$number has no pull_request CI run; it can't pass its required checks (see spikes/release-please/README.md in dotnet-agent-kit)"
            exit 1
          fi
