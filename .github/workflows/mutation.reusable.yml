# Mutation testing for any repo that uses the kit (GAP-003, TST-004, ADR-0039). Stryker.NET changes the code in
# small ways ("mutants") and runs the tests against each change; a mutant the tests don't notice survived. The
# mutation score is the share of mutants the tests killed, and TST-004 asks for at least 85%.
# Called nightly by this repo's mutation.yml, and by app repos pinned to the commit a kit release tag points to:
#   uses: DerekFoulk/dotnet-agent-kit/.github/workflows/mutation.reusable.yml@<commit SHA> # v0.1.0
name: Mutation testing (reusable)

on:
  workflow_call:
    inputs:
      solution:
        description: Solution file to mutate (.slnx).
        type: string
        required: true

permissions:
  contents: read

jobs:
  stryker:
    name: Mutation score (Stryker.NET)
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      # Through the environment, never pasted into a script, so the name can't break quoting.
      SOLUTION: ${{ inputs.solution }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer reads version tags from history
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # A new app has no projects until its first task adds them; there's nothing to mutate until then.
      - name: Count projects
        id: projects
        shell: pwsh
        run: |
          $count = ([xml](Get-Content -LiteralPath $env:SOLUTION -Raw)).SelectNodes('//Project').Count
          "count=$count" >> $env:GITHUB_OUTPUT
          "Projects in ${env:SOLUTION}: $count"

      # Stryker.NET (Apache-2.0), a dotnet tool installed for this run only, at a pinned version.
      - name: Install Stryker.NET
        if: steps.projects.outputs.count != '0'
        run: dotnet tool install dotnet-stryker --version 5.0.0 --tool-path "$RUNNER_TEMP/stryker"

      # A setting with no command-line flag (ADR-0039): skip ConfigureAwait, because ConfigureAwait(true) can't change
      # behaviour without a synchronization context, so no test could ever kill that mutant. Coverage stays per test:
      # each mutant runs only against the tests that reach it.
      - name: Write the Stryker settings
        run: |
          cat > "$RUNNER_TEMP/stryker-config.json" <<'JSON'
          {
            "stryker-config": {
              "ignore-methods": ["ConfigureAwait"]
            }
          }
          JSON

      # The Microsoft Testing Platform runner, because the kit's test projects use it (global.json).
      - name: Mutation test
        if: steps.projects.outputs.count != '0'
        run: >-
          "$RUNNER_TEMP/stryker/dotnet-stryker"
          --config-file "$RUNNER_TEMP/stryker-config.json"
          --solution "$SOLUTION"
          --test-runner mtp
          --configuration Release
          --break-at 85
          --threshold-low 85
          --threshold-high 95
          --reporter cleartext --reporter html --reporter json
          --output "$RUNNER_TEMP/stryker-output"

      # The kit's scripts, at this workflow's own commit (as in dotnet-ci.reusable.yml).
      - id: kit
        if: always() && steps.projects.outputs.count != '0'
        uses: $/.github/actions/kit-tools

      # A test that "kills" every mutant fails whatever is mutated, so the score above can't be trusted (PR 23).
      - name: Check the report can be trusted
        if: always() && steps.projects.outputs.count != '0'
        shell: pwsh
        env:
          KIT: ${{ steps.kit.outputs.path }}
        run: '& "$env:KIT/tools/Test-MutationReport.ps1" -Path "$env:RUNNER_TEMP/stryker-output/reports/mutation-report.json"'

      # The report names every surviving mutant: the line, the change, and the tests that ran against it.
      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: ${{ runner.temp }}/stryker-output/reports
          if-no-files-found: ignore
          retention-days: 14
