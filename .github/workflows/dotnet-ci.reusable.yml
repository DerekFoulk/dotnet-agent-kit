# .NET gates for any repo that uses the kit: locked restore with NuGet audit, build with zero warnings,
# format check, tests with a coverage gate, deprecated packages, empty projects, and a secret scan of the whole history.
# Called by this repo's ci.yml, and by app repos pinned to the commit a kit release tag points to:
#   uses: DerekFoulk/dotnet-agent-kit/.github/workflows/dotnet-ci.reusable.yml@<commit SHA> # v0.1.0
# The kit's scripts come from the kit at the same version (kit-tools), so an app needs no copy of them.
# The app's global.json must set the test runner to Microsoft.Testing.Platform.
name: .NET CI (reusable)

on:
  workflow_call:
    inputs:
      solution:
        description: Solution file to build (.slnx).
        type: string
        required: true

permissions:
  contents: read

jobs:
  dotnet:
    name: Build, test and package checks
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      # Through the environment, never pasted into a script, so the name can't break quoting.
      SOLUTION: ${{ inputs.solution }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer reads version tags from history
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # The kit's scripts, at this workflow's own commit (spikes/kit-sharing).
      - id: kit
        uses: $/.github/actions/kit-tools

      # An empty solution only warns "no project to restore", which would fail the zero-warnings gate.
      # The .NET steps start running when the first project is added (build step 6).
      - name: Count projects
        id: projects
        shell: pwsh
        env:
          KIT: ${{ steps.kit.outputs.path }}
        run: |
          $count = & "$env:KIT/tools/Get-SolutionProjectCount.ps1" -Solution $env:SOLUTION
          "count=$count" >> $env:GITHUB_OUTPUT
          "Projects in ${env:SOLUTION}: $count"

      # NuGetAudit and TreatWarningsAsErrors (Directory.Build.props) make a known vulnerability fail here.
      - name: Restore (locked)
        if: steps.projects.outputs.count != '0'
        run: dotnet restore "$SOLUTION" --locked-mode

      # -warnaserror also fails warnings raised outside any project, such as NuGet's solution-level ones,
      # which Directory.Build.props can't reach (owner, 2026-11-04).
      - name: Build (zero warnings)
        if: steps.projects.outputs.count != '0'
        run: dotnet build "$SOLUTION" --no-restore --configuration Release -warnaserror

      - name: Format check
        if: steps.projects.outputs.count != '0'
        run: dotnet format "$SOLUTION" --verify-no-changes --no-restore

      # Microsoft Testing Platform (global.json) runs every test project; each writes a Cobertura report.
      - name: Test with coverage
        if: steps.projects.outputs.count != '0'
        run: dotnet test --solution "$SOLUTION" --no-build --configuration Release --coverage --coverage-output-format cobertura --results-directory "$RUNNER_TEMP/test-results"

      # TST-004: 100% line coverage for *.Domain, 95% for *.Application, 90% overall.
      - name: Coverage gate
        if: steps.projects.outputs.count != '0'
        shell: pwsh
        env:
          KIT: ${{ steps.kit.outputs.path }}
        run: '& "$env:KIT/tools/Test-CoverageGate.ps1" -Path "$env:RUNNER_TEMP/test-results" -Solution $env:SOLUTION'

      - name: Deprecated packages
        shell: pwsh
        env:
          KIT: ${{ steps.kit.outputs.path }}
        run: '& "$env:KIT/tools/Test-DeprecatedPackages.ps1" -Path $env:SOLUTION'

      - name: Empty projects
        shell: pwsh
        env:
          KIT: ${{ steps.kit.outputs.path }}
        run: '& "$env:KIT/tools/Test-EmptyProjects.ps1" -Solution $env:SOLUTION'

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan every commit, not just the latest tree
          persist-credentials: false # nothing in .git for the container to read

      # The gitleaks CLI (MIT) from its official image, pinned by digest (ADR-0024). The GIT_CONFIG_*
      # variables mark the mounted checkout as safe for git inside the container.
      - name: Scan the full git history
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --verbose
