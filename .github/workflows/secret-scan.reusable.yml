# The secret scan of a push to any branch or tag (ADR-0024): a secret is exposed once it's pushed, PR or not, so each
# push is scanned as its own run, which fails on the ref that holds the secret and tells whoever pushed it. A red run
# means the secret is already exposed: rotate it, since rewriting the branch doesn't take it back.
# It runs the same scan as the .NET CI's required job (.github/actions/secret-scan): every commit HEAD reaches.
# Called by this repo's secret-scan.yml, and by app repos pinned to the commit a kit release tag points to:
#   uses: DerekFoulk/dotnet-agent-kit/.github/workflows/secret-scan.reusable.yml@<commit SHA> # v0.1.0
name: Secret scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    # Deleting a branch is a push event too; its run's SHA is the default branch's, which CI already scans.
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan every commit HEAD reaches, not just the latest tree
          persist-credentials: false # nothing in .git for the container to read

      - uses: $/.github/actions/secret-scan
