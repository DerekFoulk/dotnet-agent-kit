# This repo's mutation testing (GAP-003, TST-004, ADR-0039): nightly, on demand, and on every pull request that
# changes a file the run could read, so such a change is proved before it merges. It isn't a required check.
# The filter lists what can't matter, not what does: a list of inputs falls behind silently, while a gap here
# only costs one extra run. MutationCi.Tests.ps1 fails if an ignored path holds a file the run reads.
name: Mutation testing

on:
  schedule:
    - cron: '17 6 * * *' # 06:17 UTC daily, off the busy top of the hour
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - docs/**
      - '*.md'
      - .claude/**
      - .githooks/**
      - .vscode/**
      - spikes/**
      - templates/**
      - tools/tests/**

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    uses: ./.github/workflows/mutation.reusable.yml
    with:
      solution: dotnet-agent-kit.slnx
