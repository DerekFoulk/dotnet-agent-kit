# This repo's mutation testing (GAP-003, TST-004, ADR-0039): nightly, on demand, and on a pull request that
# changes any file the run reads, so such a change is proved before it merges. Too slow for every PR.
# MutationCi.Tests.ps1 finds those files from mutation.reusable.yml and the repo root, and fails if one is missing.
name: Mutation testing

on:
  schedule:
    - cron: '17 6 * * *' # 06:17 UTC daily, off the busy top of the hour
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/mutation.reusable.yml
      - .github/workflows/mutation.yml
      - .github/actions/kit-tools/**
      - .config/dotnet-tools.json
      - .config/stryker-config.json
      - tools/Test-MutationReport.ps1
      - tools/Get-SolutionProjectCount.ps1
      - global.json
      - nuget.config
      - Directory.Build.props
      - Directory.Packages.props
      - dotnet-agent-kit.slnx
      - sample/**

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    uses: ./.github/workflows/mutation.reusable.yml
    with:
      solution: dotnet-agent-kit.slnx
