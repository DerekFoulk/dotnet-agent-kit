# This repo's secret scan of every push to a branch other than main, and of every tag push (ADR-0024). CI scans main
# on its push run and each pull request's merge commit; this covers branches with no pull request, and tags. Runs are
# never cancelled: a later push, even a force-push, doesn't take back a commit an earlier one exposed.
name: Secret scan

on:
  push:
    branches-ignore: [main]
    tags: ['**']

permissions:
  contents: read

jobs:
  scan:
    uses: ./.github/workflows/secret-scan.reusable.yml
