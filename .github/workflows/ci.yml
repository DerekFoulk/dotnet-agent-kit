# This repo's CI: the reusable .NET gates and the kit's own checks, on every pull request and on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    uses: ./.github/workflows/dotnet-ci.reusable.yml
    with:
      solution: dotnet-agent-kit.slnx

  kit:
    uses: ./.github/workflows/kit-checks.reusable.yml

  # CodeQL code scanning (ADR-0036): free here, because the kit is public.
  codeql:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.reusable.yml
