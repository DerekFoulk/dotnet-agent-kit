name: release

# The kit's releases, from the job every app shares (release-please.reusable.yml; ADR-0022, ADR-0096): merging the
# release PR tags vX.Y.Z and publishes a GitHub Release. The kit has nothing to build or publish on a release yet.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    uses: ./.github/workflows/release-please.reusable.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
