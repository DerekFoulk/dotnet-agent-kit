# Keeps packages, dotnet tools (.config/dotnet-tools.json), pinned GitHub Actions and the global.json SDK pin
# current (SUP-008, ADR-0025).
# The "chore(deps)" prefix makes each PR title a Conventional Commit, which CI requires.
# Not covered: the gitleaks image in dotnet-ci.reusable.yml is pinned inside a run command, so bump it
# by hand with its release.
# NuGet PRs: dependabot-lockfiles.yml refreshes the lock files Dependabot misses (dependabot-core#13950).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
