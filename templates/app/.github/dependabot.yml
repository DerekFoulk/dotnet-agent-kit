# Keeps packages, pinned GitHub Actions and the global.json SDK pin current (SUP-008, ADR-0025).
# The "chore(deps)" prefix makes each PR title a Conventional Commit, which CI requires.
# The kit's own pin (DerekFoulk/dotnet-agent-kit) is moved by the kit's sync job; check any pin
# Dependabot proposes against a kit release tag before merging (ADR-0031).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
