# Keeps {{Name}}'s NuGet packages current. The "chore" prefix makes each PR title a Conventional Commit,
# which CI requires. "include: scope" adds "(deps)", but the NuGet updater ignores it for now
# (dependabot-core#15158), so PRs come as "chore: Bump ..."; keep it for when that's fixed.
# The kit's sync job moves the kit pin (DerekFoulk/dotnet-agent-kit) and the global.json SDK pin with each
# kit release, so they aren't listed here (ADR-0032). This file is the app's: add an ecosystem when the app
# adds one of its own, such as github-actions for its own workflows, and check any kit pin Dependabot
# proposes against a kit release tag before merging (ADR-0031).
# Each update waits before Dependabot proposes it: 7 days, and 14 for a major, so a release that's pulled or
# found compromised in its first days never reaches a PR (the kit's ADR-0041). Security updates don't wait.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
      semver-major-days: 14
