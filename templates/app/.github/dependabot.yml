# Keeps {{Name}}'s NuGet packages and its dotnet-agent-kit pin current. The "chore" prefix makes each PR title a
# Conventional Commit, which CI requires. "include: scope" adds "(deps)", but the NuGet updater ignores it for now
# (dependabot-core#15158), so NuGet PRs come as "chore: Bump ..."; keep it for when that's fixed.
# Kit updates (the kit's ADR-0044): Dependabot moves the kit pin in this app's workflows to a new kit release, in
# one PR for every kit reference, because a workflow's own token can't change workflow files. On that PR,
# .github/workflows/kit-sync.yml brings in the release's other kit-managed files, global.json's SDK pin
# included, so there's no dotnet-sdk entry here. Check the kit pin against a kit release tag before merging
# (ADR-0031); the sync's comment on the PR says how.
# This file is the app's: add an ecosystem when the app adds one of its own.
# Each update waits before Dependabot proposes it: 7 days, and 14 for a NuGet major, so a release that's pulled
# or found compromised in its first days never reaches a PR (the kit's ADR-0041), except the Playwright image below,
# which Dependabot doesn't hold back (the kit's GAP-046); give an ecosystem you add the
# same cooldown (github-actions supports only default-days). Security updates, which New-KitApp turns on,
# don't wait. Shortening or narrowing the wait is a guardrail change: an agent merges it only on the owner's yes.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    # .kit is the kit's: its copy of the kit's package versions builds the kit's code shape tool, and the kit's
    # releases move it (the kit's ADR-0078).
    exclude-paths:
      - .kit/**
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
      semver-major-days: 14

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
    groups:
      dotnet-agent-kit:
        patterns:
          - DerekFoulk/dotnet-agent-kit*

  # The Playwright image the kit's shared CI runs this app's browser tests in, pinned by tag and digest (the kit's
  # GAP-033, ADR-0061). Docker takes no semver-*-days, and for this MCR image Dependabot finds no publication date, so
  # it applies no cooldown at all (the kit's GAP-046). Its version must be Microsoft.Playwright's in
  # Directory.Packages.props, which the nuget entry moves, after its 7 days, in a PR of its own: CI fails each until both
  # move, so bring the two into one PR, re-reading the image's digest then, since the image PR read it on its first days
  # (docs/standards/testing.md, "Browser and accessibility tests").
  - package-ecosystem: docker
    directory: /.config/playwright
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
