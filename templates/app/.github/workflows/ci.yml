# {{Name}}'s .NET gates, from dotnet-agent-kit's shared workflow. The kit is pinned to the commit its
# release tag points to (ADR-0031); the sync job moves the pin with each kit release.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    uses: DerekFoulk/dotnet-agent-kit/.github/workflows/dotnet-ci.reusable.yml@{{KitCommit}} # {{KitVersion}}
    with:
      solution: {{Name}}.slnx

  # CodeQL code scanning (kit ADR-0036). It's free on a public repo; a private one would need GitHub Code
  # Security, a paid licence, so it's skipped there.
  codeql:
    if: ${{ !github.event.repository.private }}
    permissions:
      contents: read
      security-events: write
    uses: DerekFoulk/dotnet-agent-kit/.github/workflows/codeql.reusable.yml@{{KitCommit}} # {{KitVersion}}
