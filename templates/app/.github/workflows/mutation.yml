# {{Name}}'s mutation testing (kit ADR-0039): Stryker.NET nightly, failing below a mutation score of 85% (kit
# TST-004). It's too slow for every pull request, so it isn't a required check; a failed night shows on the Actions
# tab. The kit is pinned to the commit its release tag points to (ADR-0031); the sync job moves the pin.
name: Mutation testing

on:
  schedule:
    - cron: '17 6 * * *' # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    uses: DerekFoulk/dotnet-agent-kit/.github/workflows/mutation.reusable.yml@{{KitCommit}} # {{KitVersion}}
    with:
      solution: {{Name}}.slnx
