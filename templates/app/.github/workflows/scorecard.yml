# {{Name}}'s OpenSSF Scorecard (kit SUP-010, ADR-0056): on every push to main and weekly. It isn't a pull request
# check: Scorecard scores the default branch. The shared workflow skips a private repo, where the action publishes
# nothing and code scanning needs GitHub Code Security, a paid licence. The kit is pinned to the commit its release
# tag points to (ADR-0031); Dependabot moves the pin with each kit release (kit ADR-0045).
name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '29 5 * * 1' # 05:29 UTC every Monday

permissions:
  contents: read

jobs:
  scorecard:
    permissions:
      security-events: write
      id-token: write
    uses: DerekFoulk/dotnet-agent-kit/.github/workflows/scorecard.reusable.yml@{{KitCommit}} # {{KitVersion}}
