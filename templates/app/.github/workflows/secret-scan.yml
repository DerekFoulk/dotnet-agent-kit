# {{Name}}'s secret scan of every push to a branch other than main, and of every tag push (kit ADR-0024). CI scans
# main on its push run and each pull request's merge commit; this covers branches with no pull request, and tags. A
# red run means a secret is already exposed: rotate it. On a private repo each run uses about a minute of the
# account's Actions allowance ($0.006 a minute beyond it, kit ADR-0024). The kit is pinned to the commit its release tag points to (ADR-0031); Dependabot moves
# the pin with each kit release (kit ADR-0045).
name: Secret scan

on:
  push:
    branches-ignore: [main]
    tags: ['**']

permissions:
  contents: read

jobs:
  scan:
    uses: DerekFoulk/dotnet-agent-kit/.github/workflows/secret-scan.reusable.yml@{{KitCommit}} # {{KitVersion}}
